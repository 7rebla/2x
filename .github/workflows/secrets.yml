name: secrets

# Scans the complete Git history for committed secrets on every push and
# pull request. Uses the same compose service and the same .gitleaks.toml as
# the local run (deploy/compose/compose.tools.yaml).

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with gitleaks
        run: docker compose -f deploy/compose/compose.tools.yaml run --rm gitleaks-git
