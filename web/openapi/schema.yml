        id:
          type: integer
          readOnly: true
        area:
          type: integer
        key:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        name:
          type: string
          maxLength: 200
        notes:
          type: string
        created_at:
          type: string
          format: date-time
