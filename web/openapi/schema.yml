openapi: 3.0.3
info:
  title: 2x API
  version: 0.0.0
  description: Asset records with sourced answers.
paths:
  /api/v1/areas/:
    get:
      operationId: areas_list
      description: Areas of the sites.
      parameters:
      - in: query
        name: site
        schema:
          type: integer
        description: Only areas of the site with this id.
      tags:
      - areas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'
          description: ''
    post:
      operationId: areas_create
      description: Areas of the sites.
      tags:
      - areas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
          description: ''
  /api/v1/areas/{id}/:
    get:
      operationId: areas_retrieve
      description: Areas of the sites.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this area.
        required: true
      tags:
      - areas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
          description: ''
    put:
      operationId: areas_update
      description: Areas of the sites.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this area.
        required: true
      tags:
      - areas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
          description: ''
    patch:
      operationId: areas_partial_update
      description: Areas of the sites.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this area.
        required: true
      tags:
      - areas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArea'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
          description: ''
  /api/v1/audit-log/:
    get:
      operationId: audit_log_list
      description: |-
        The change log: who changed what and when, newest first (E-43).

        For the role "Manage" only. Read-only: there is no way to change or
        delete entries through the API.
      parameters:
      - in: query
        name: actor
        schema:
          type: string
        description: Only entries of the user with this user name.
      - in: query
        name: object_id
        schema:
          type: integer
        description: Only entries of the object with this id (use with object_type).
      - in: query
        name: object_type
        schema:
          type: string
        description: Only entries of this kind of object, for example assets.device.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - audit-log
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogEntryList'
          description: ''
  /api/v1/devices/:
    get:
      operationId: devices_list
      description: |-
        Devices of the plants, each with its chain plant > area > site.

        Writes take the plant as an id (``DeviceWrite``); every answer shows the
        device as it is read (``Device``).
      parameters:
      - in: query
        name: plant
        schema:
          type: integer
        description: Only devices of the plant with this id.
      - in: query
        name: site
        schema:
          type: integer
        description: Only devices of the site with this id (through area and plant).
      tags:
      - devices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
          description: ''
    post:
      operationId: devices_create
      description: |-
        Devices of the plants, each with its chain plant > area > site.

        Writes take the plant as an id (``DeviceWrite``); every answer shows the
        device as it is read (``Device``).
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/{device_id}/documents/:
    get:
      operationId: device_documents_list
      description: The files of the device, each with its newest version, ordered
        by title.
      parameters:
      - in: path
        name: device_id
        schema:
          type: integer
        required: true
      tags:
      - devices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No role, or not allowed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found.
    post:
      operationId: device_documents_create
      description: |-
        Upload a new file of the device as version 1.

        ``duplicates`` lists other places with the same content; the upload is
        accepted all the same.
      parameters:
      - in: path
        name: device_id
        schema:
          type: integer
        required: true
      tags:
      - devices
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
          description: ''
        '400':
          description: Invalid form, or a configuration file.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No role, or not allowed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Larger than TWOX_UPLOAD_MAX_BYTES.
  /api/v1/devices/{id}/:
    get:
      operationId: devices_retrieve
      description: |-
        Devices of the plants, each with its chain plant > area > site.

        Writes take the plant as an id (``DeviceWrite``); every answer shows the
        device as it is read (``Device``).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
    put:
      operationId: devices_update
      description: |-
        Devices of the plants, each with its chain plant > area > site.

        Writes take the plant as an id (``DeviceWrite``); every answer shows the
        device as it is read (``Device``).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
    patch:
      operationId: devices_partial_update
      description: |-
        Devices of the plants, each with its chain plant > area > site.

        Writes take the plant as an id (``DeviceWrite``); every answer shows the
        device as it is read (``Device``).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this device.
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDeviceWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/document-versions/{version_id}/download/:
    get:
      operationId: document_version_download
      description: 'Download the version: streamed from the storage, always as an
        attachment.'
      parameters:
      - in: path
        name: version_id
        schema:
          type: integer
        required: true
      tags:
      - document-versions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: The file as an attachment. Content-Type is the stored type
            if it is a known document or image type, otherwise application/octet-stream.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No role, or not allowed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found.
  /api/v1/document-versions/{version_id}/ingest/:
    post:
      operationId: document_version_ingest
      description: |-
        Create a new ingest job for the version; the requester is the signed-in user.

        A file outside the ingested formats gets a job that is ``skipped`` at
        once, missing content a ``failed`` one (``content_missing``); both
        answer 202 as well. A queued job is sent to the worker after the commit.
      parameters:
      - in: path
        name: version_id
        schema:
          type: integer
        required: true
      tags:
      - document-versions
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestJob'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRequestError'
          description: The version belongs to a configuration, which is not ingested.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No role, or not allowed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestConflict'
          description: The version has a queued or running ingest job already.
  /api/v1/documents/{document_id}/:
    get:
      operationId: document_retrieve
      description: The file with all versions, oldest first.
      parameters:
      - in: path
        name: document_id
        schema:
          type: integer
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No role, or not allowed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found.
  /api/v1/documents/{document_id}/versions/:
    post:
      operationId: document_version_create
      description: |-
        Upload a new version of the file.

        409 if the content equals the newest version; the answer names that
        version. The same content as an older version or another file is
        accepted and listed in ``duplicates``.
      parameters:
      - in: path
        name: document_id
        schema:
          type: integer
        required: true
      tags:
      - documents
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VersionUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
          description: ''
        '400':
          description: Invalid form, or a configuration file.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No role, or not allowed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateVersionError'
          description: ''
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Larger than TWOX_UPLOAD_MAX_BYTES.
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: 'Open to everyone on purpose: container health checks carry no
        credentials.'
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/imports/devices/:
    post:
      operationId: devices_import
      description: |-
        Check a device list and, without dry run, save it.

        A dry run (the default) checks the file and counts what an import
        would create, update or leave unchanged, and saves nothing. Without
        dry run everything is saved in one transaction, or nothing if any row
        has an error. Errors in the file come back in ``errors`` with line and
        column, with status 200; ``saved`` tells whether anything was saved.
      tags:
      - imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceImportForm'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
          description: ''
        '400':
          description: 'Invalid form: no file, or dry_run no boolean.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not the role manage.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Larger than TWOX_UPLOAD_MAX_BYTES.
  /api/v1/ingest-jobs/:
    get:
      operationId: ingest_jobs_list
      description: |-
        Every ingest job, newest first, 50 per page.

        For both roles. ``requested_by`` names the user for the role ``manage``
        only and is ``null`` for the role ``read``.
      parameters:
      - in: query
        name: device
        schema:
          type: integer
        description: Only jobs of documents of the device with this id.
      - in: query
        name: document
        schema:
          type: integer
        description: Only jobs of the document with this id.
      - in: query
        name: latest
        schema:
          type: boolean
          default: false
        description: 'Only the newest job of each version (is_latest); the other filters
          apply to these. Default false: every attempt.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - done
            - failed
            - queued
            - running
            - skipped
        description: Only jobs in one of these states; repeat the parameter for more.
        explode: true
      - in: query
        name: version
        schema:
          type: integer
        description: Only jobs of the document version with this id.
      tags:
      - ingest-jobs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIngestJobList'
          description: ''
        '400':
          description: Invalid filter value.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No role, or not allowed.
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: |-
        The signed-in user and their role.

        Open to every signed-in user, also without a role, so that the web UI can
        tell such a user why nothing else is available.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/plants/:
    get:
      operationId: plants_list
      description: Plants of the areas.
      parameters:
      - in: query
        name: area
        schema:
          type: integer
        description: Only plants of the area with this id.
      tags:
      - plants
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plant'
          description: ''
    post:
      operationId: plants_create
      description: Plants of the areas.
      tags:
      - plants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plant'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
          description: ''
  /api/v1/plants/{id}/:
    get:
      operationId: plants_retrieve
      description: Plants of the areas.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this plant.
        required: true
      tags:
      - plants
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
          description: ''
    put:
      operationId: plants_update
      description: Plants of the areas.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this plant.
        required: true
      tags:
      - plants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plant'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
          description: ''
    patch:
      operationId: plants_partial_update
      description: Plants of the areas.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this plant.
        required: true
      tags:
      - plants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlant'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
          description: ''
  /api/v1/search/:
    get:
      operationId: search
      description: |-
        Hits for ``q``, best first, at most ``limit``; optionally only on some devices or plants.

        A query that is mainly identifiers (an address, an error code) gets
        the sections that contain them first, and so does every query when
        the search by meaning does not take part. Otherwise a question ranks
        keyword and meaning matches together; an identifier in it counts
        only through these two.
        The same content stored for several devices is one hit with all its
        places.
      parameters:
      - in: query
        name: device
        schema:
          type: array
          items:
            type: integer
            maximum: 9223372036854775807
            minimum: 1
            format: int64
          maxItems: 100
        description: Only hits on one of these devices (ids); repeat the parameter
          for more.
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
        description: Most hits in the answer.
      - in: query
        name: plant
        schema:
          type: array
          items:
            type: integer
            maximum: 9223372036854775807
            minimum: 1
            format: int64
          maxItems: 100
        description: Only hits in one of these plants (ids); repeat the parameter
          for more.
      - in: query
        name: q
        schema:
          type: string
          maxLength: 500
          minLength: 1
        description: 'What to search for: words, identifiers such as IP addresses
          or part numbers, or a question. "-word" excludes a word, "two words" in
          quotes is a phrase.'
        required: true
      tags:
      - search
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
          description: ''
        '400':
          description: Invalid parameter; the errors are per field.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No role.
  /api/v1/selftest/:
    get:
      operationId: selftest_retrieve
      description: |-
        Read-only self-test for signed-in users with a role.

        Every call queues a task for the worker, so anonymous requests and users
        without a role get 403 (work order 027). The view states no permission of
        its own: the defaults apply, that is the Django session
        (``SessionAuthentication``) and ``CanRead`` (role ``read`` or ``manage``).
      tags:
      - selftest
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selftest'
          description: ''
  /api/v1/sites/:
    get:
      operationId: sites_list
      description: Sites of the operation.
      tags:
      - sites
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
          description: ''
    post:
      operationId: sites_create
      description: Sites of the operation.
      tags:
      - sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Site'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
  /api/v1/sites/{id}/:
    get:
      operationId: sites_retrieve
      description: Sites of the operation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this site.
        required: true
      tags:
      - sites
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
    put:
      operationId: sites_update
      description: Sites of the operation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this site.
        required: true
      tags:
      - sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Site'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
    patch:
      operationId: sites_partial_update
      description: Sites of the operation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this site.
        required: true
      tags:
      - sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
components:
  schemas:
    AiCheck:
      type: object
      description: |-
        ``enabled`` always; the other fields only with the AI features on.

        ``ok``, ``model``, ``dimensions`` and ``error`` describe the embedding
        model, the ``chat_*`` fields the chat model (empty ``chat_model``: none
        configured).
      properties:
        enabled:
          type: boolean
        ok:
          type: boolean
        model:
          type: string
        dimensions:
          type: integer
          minimum: 0
        error:
          type: string
        chat_model:
          type: string
        chat_ok:
          type: boolean
        chat_error:
          type: string
      required:
      - enabled
    Area:
      type: object
      description: An area of a site. ``site`` is the id of the site.
      properties:
        id:
          type: integer
          readOnly: true
        site:
          type: integer
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - site
      - updated_at
    AreaRef:
      type: object
      description: The area of a device, for reading.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    AuditActionEnum:
      enum:
      - create
      - update
      - delete
      type: string
      description: |-
        * `create` - create
        * `update` - update
        * `delete` - delete
    AuditLogEntry:
      type: object
      description: 'One entry of the change log: who changed which object when, and
        how.'
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: string
          readOnly: true
          nullable: true
          description: User name of the actor; null for changes without a signed-in
            user.
        action:
          allOf:
          - $ref: '#/components/schemas/AuditActionEnum'
          readOnly: true
        object_type:
          type: string
          description: App label and model, for example assets.device.
          readOnly: true
        object_id:
          type: integer
          readOnly: true
          nullable: true
        object_repr:
          type: string
          readOnly: true
          title: Object representation
        changes:
          type: object
          description: 'Changed fields by name. A plain field has [old, new]; on create
            old is null, on delete new is null. Times are UTC, written without a zone
            ("2026-01-31 12:00:00.000000"); a reference to another object is its id.
            The groups of a user (the role) have {"type": "m2m", "operation": "add"
            or "delete", "objects": [group names]}.'
          additionalProperties:
            oneOf:
            - type: array
              items: {}
              minItems: 2
              maxItems: 2
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - m2m
                operation:
                  type: string
                  enum:
                  - add
                  - delete
                objects:
                  type: array
                  items:
                    type: string
              required:
              - type
              - operation
              - objects
          readOnly: true
      required:
      - action
      - actor
      - changes
      - id
      - object_id
      - object_repr
      - object_type
      - timestamp
    BlankEnum:
      enum:
      - ''
    DatabaseCheck:
      type: object
      properties:
        ok:
          type: boolean
        server_version:
          type: string
        error:
          type: string
      required:
      - error
      - ok
      - server_version
    Device:
      type: object
      description: A device with its chain plant > area > site, for reading.
      properties:
        id:
          type: integer
          readOnly: true
        plant:
          allOf:
          - $ref: '#/components/schemas/PlantRef'
          readOnly: true
        area:
          allOf:
          - $ref: '#/components/schemas/AreaRef'
          readOnly: true
        site:
          allOf:
          - $ref: '#/components/schemas/SiteRef'
          readOnly: true
        key:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        device_class:
          allOf:
          - $ref: '#/components/schemas/DeviceClassEnum'
          readOnly: true
        manufacturer:
          type: string
          readOnly: true
        model:
          type: string
          readOnly: true
        software_version:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        address_source:
          type: string
          readOnly: true
        protocols:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_source
      - area
      - created_at
      - device_class
      - id
      - ip_address
      - key
      - manufacturer
      - model
      - name
      - notes
      - plant
      - protocols
      - site
      - software_version
      - updated_at
    DeviceClassEnum:
      enum:
      - plc
      - controller
      - computer
      - router
      - firewall
      - robot
      - other
      type: string
      description: |-
        * `plc` - PLC
        * `controller` - Controller / embedded
        * `computer` - Computer / edge
        * `router` - Router
        * `firewall` - Firewall
        * `robot` - Robot
        * `other` - Other
    DeviceImportForm:
      type: object
      description: Form of a device list import (``multipart/form-data``).
      properties:
        file:
          type: string
          format: binary
          description: 'The device list as CSV: UTF-8, comma, the 13 columns of format
            version 1, optionally followed by device_class; at most TWOX_UPLOAD_MAX_BYTES
            bytes.'
        dry_run:
          type: boolean
          default: true
          description: Check and count only, save nothing (default). Send false to
            save.
      required:
      - file
    DeviceWrite:
      type: object
      description: |-
        Input for creating and changing a device. ``plant`` is the id of the plant.

        An empty IP address is stored as no address (``null``).
      properties:
        plant:
          type: integer
        key:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        name:
          type: string
          maxLength: 200
        device_class:
          $ref: '#/components/schemas/DeviceClassEnum'
        manufacturer:
          type: string
        model:
          type: string
        software_version:
          type: string
        ip_address:
          type: string
          nullable: true
        address_source:
          type: string
        protocols:
          type: string
        notes:
          type: string
      required:
      - key
      - name
      - plant
    Document:
      type: object
      description: A file of a device with its newest version.
      properties:
        id:
          type: integer
          readOnly: true
        device:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
          nullable: true
          description: User name of the creator; null for the system.
        latest_version:
          allOf:
          - $ref: '#/components/schemas/DocumentVersion'
          nullable: true
          readOnly: true
      required:
      - created_at
      - created_by
      - device
      - id
      - kind
      - latest_version
      - title
    DocumentDetail:
      type: object
      description: A file of a device with all its versions, oldest first.
      properties:
        id:
          type: integer
          readOnly: true
        device:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
          nullable: true
          description: User name of the creator; null for the system.
        latest_version:
          allOf:
          - $ref: '#/components/schemas/DocumentVersion'
          nullable: true
          readOnly: true
        versions:
          type: array
          items:
            $ref: '#/components/schemas/DocumentVersion'
          readOnly: true
      required:
      - created_at
      - created_by
      - device
      - id
      - kind
      - latest_version
      - title
      - versions
    DocumentUpload:
      type: object
      description: Form of a new file (``multipart/form-data``).
      properties:
        file:
          type: string
          format: binary
          description: The file; at most TWOX_UPLOAD_MAX_BYTES bytes.
        title:
          type: string
          description: Title of the document; the file name if empty or missing.
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          default: document
          description: |-
            Only 'document' is accepted for now; configurations follow with redaction.

            * `document` - document
            * `configuration` - configuration
      required:
      - file
    DocumentVersion:
      type: object
      description: One immutable version of a document; its bytes come from the download
        endpoint.
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
          readOnly: true
        sha256:
          type: string
          readOnly: true
          title: SHA-256
        size:
          type: integer
          readOnly: true
          title: Size in bytes
        content_type:
          type: string
          readOnly: true
        original_filename:
          type: string
          readOnly: true
          title: Original file name
        uploaded_by:
          type: string
          readOnly: true
          nullable: true
          description: User name of the uploader; null for the system.
        created_at:
          type: string
          format: date-time
          readOnly: true
        ingest:
          allOf:
          - $ref: '#/components/schemas/IngestJobSummary'
          nullable: true
          readOnly: true
          description: The newest ingest job of the version; null if it was never
            ingested.
      required:
      - content_type
      - created_at
      - id
      - ingest
      - number
      - original_filename
      - sha256
      - size
      - uploaded_by
    Duplicate:
      type: object
      description: Another place where the same content is already stored.
      properties:
        device:
          type: integer
        device_key:
          type: string
        device_name:
          type: string
        document:
          type: integer
        document_title:
          type: string
        version:
          type: integer
        version_number:
          type: integer
      required:
      - device
      - device_key
      - device_name
      - document
      - document_title
      - version
      - version_number
    DuplicateVersionError:
      type: object
      description: '409: the upload equals the newest version of the document.'
      properties:
        detail:
          type: string
        code:
          type: string
        existing_version:
          $ref: '#/components/schemas/DocumentVersion'
      required:
      - code
      - detail
      - existing_version
    ErrorCodeEnum:
      enum:
      - docling_unavailable
      - docling_rejected
      - conversion_failed
      - content_missing
      - unsupported_format
      - embedding_unavailable
      - embedding_rejected
      - embedding_dimension_mismatch
      - timeout
      - internal
      type: string
      description: |-
        * `docling_unavailable` - converter unavailable
        * `docling_rejected` - converter rejected the file
        * `conversion_failed` - conversion failed
        * `content_missing` - stored content missing
        * `unsupported_format` - unsupported format
        * `embedding_unavailable` - embedding service unavailable
        * `embedding_rejected` - embedding service rejected the request
        * `embedding_dimension_mismatch` - embedding has the wrong number of dimensions
        * `timeout` - time limit exceeded
        * `internal` - internal error
    ErrorDetail:
      type: object
      description: An error with a message, for example 404 or 413.
      properties:
        detail:
          type: string
      required:
      - detail
    Health:
      type: object
      description: Shape of the health response, used for the OpenAPI schema.
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    ImportCounts:
      type: object
      description: What an import did, or would do in a dry run, at one level of the
        structure.
      properties:
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
      required:
      - created
      - unchanged
      - updated
    ImportReport:
      type: object
      description: |-
        Result of a device list import.

        ``saved`` is true only if the changes were saved. With errors nothing is
        saved and all counts are zero.
      properties:
        dry_run:
          type: boolean
        saved:
          type: boolean
        rows:
          type: integer
          description: Number of data rows read.
        sites:
          $ref: '#/components/schemas/ImportCounts'
        areas:
          $ref: '#/components/schemas/ImportCounts'
        plants:
          $ref: '#/components/schemas/ImportCounts'
        devices:
          $ref: '#/components/schemas/ImportCounts'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportRowError'
      required:
      - areas
      - devices
      - dry_run
      - errors
      - plants
      - rows
      - saved
      - sites
    ImportRowError:
      type: object
      description: An error in the imported file.
      properties:
        line:
          type: integer
          nullable: true
          description: Line where the row starts (the header is line 1); null for
            the whole file.
        column:
          type: string
          nullable: true
          description: Column of the file; null for the whole row or file.
        message:
          type: string
      required:
      - column
      - line
      - message
    IngestConflict:
      type: object
      description: '409: the version has a queued or running ingest job already.'
      properties:
        detail:
          type: string
        code:
          type: string
        job:
          allOf:
          - $ref: '#/components/schemas/IngestJobSummary'
          description: The queued or running job.
      required:
      - code
      - detail
      - job
    IngestJob:
      type: object
      description: |-
        An ingest job with its document, version and device.

        ``requested_by`` is the user name only when the context says so
        (:data:`SHOW_REQUESTED_BY`, the role ``manage``); otherwise ``null``.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/IngestStatusEnum'
          readOnly: true
          default: queued
        step:
          readOnly: true
          description: |-
            Step the job is in or failed in; empty before the first step.

            * `convert` - convert
            * `sections` - sections
            * `embed` - embed
          oneOf:
          - $ref: '#/components/schemas/StepEnum'
          - $ref: '#/components/schemas/BlankEnum'
        error_code:
          readOnly: true
          description: |-
            Kind of error of a failed or skipped job; empty otherwise.

            * `docling_unavailable` - converter unavailable
            * `docling_rejected` - converter rejected the file
            * `conversion_failed` - conversion failed
            * `content_missing` - stored content missing
            * `unsupported_format` - unsupported format
            * `embedding_unavailable` - embedding service unavailable
            * `embedding_rejected` - embedding service rejected the request
            * `embedding_dimension_mismatch` - embedding has the wrong number of dimensions
            * `timeout` - time limit exceeded
            * `internal` - internal error
          oneOf:
          - $ref: '#/components/schemas/ErrorCodeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        error_detail:
          type: string
          readOnly: true
          description: Technical detail in English. Set for failed and skipped jobs,
            and as a note for a job that was converted only in part.
        partly_converted:
          type: boolean
          readOnly: true
          description: True if Docling converted the document only in part (conversion_error_count
            above 0), also when the embedding failed afterwards.
        conversion_error_count:
          type: integer
          minimum: 0
          readOnly: true
          description: Errors Docling reported for a conversion it finished only in
            part; 0 for a complete conversion and for a job that has not converted
            anything yet. An embedding job carries the count of the conversion before
            it.
        section_count:
          type: integer
          readOnly: true
          nullable: true
        page_count:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        document:
          allOf:
          - $ref: '#/components/schemas/IngestJobDocument'
          readOnly: true
        version:
          allOf:
          - $ref: '#/components/schemas/IngestJobVersion'
          readOnly: true
        device:
          allOf:
          - $ref: '#/components/schemas/IngestJobDevice'
          readOnly: true
        requested_by:
          type: string
          nullable: true
          readOnly: true
          description: User name of the user who started the job; null for the system,
            and always null for the role read.
        is_latest:
          type: boolean
          readOnly: true
          description: Whether this is the newest job of its version (the job in the
            field ingest of the version); false for an older attempt.
      required:
      - conversion_error_count
      - created_at
      - device
      - document
      - error_code
      - error_detail
      - finished_at
      - id
      - is_latest
      - page_count
      - partly_converted
      - requested_by
      - section_count
      - status
      - step
      - version
    IngestJobDevice:
      type: object
      description: The device the document of an ingest job belongs to.
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - key
      - name
    IngestJobDocument:
      type: object
      description: The document of an ingest job.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
      required:
      - id
      - title
    IngestJobSummary:
      type: object
      description: |-
        State of one ingest job of a version (work order 051).

        ``error_code`` is a fixed key that the web UI translates; ``error_detail``
        is a short English technical text, cleaned of paths, addresses and file
        names (046). Every role sees both (E-57).
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/IngestStatusEnum'
          readOnly: true
        step:
          readOnly: true
          description: |-
            Step the job is in or failed in; empty before the first step.

            * `convert` - convert
            * `sections` - sections
            * `embed` - embed
          oneOf:
          - $ref: '#/components/schemas/StepEnum'
          - $ref: '#/components/schemas/BlankEnum'
        error_code:
          readOnly: true
          description: |-
            Kind of error of a failed or skipped job; empty otherwise.

            * `docling_unavailable` - converter unavailable
            * `docling_rejected` - converter rejected the file
            * `conversion_failed` - conversion failed
            * `content_missing` - stored content missing
            * `unsupported_format` - unsupported format
            * `embedding_unavailable` - embedding service unavailable
            * `embedding_rejected` - embedding service rejected the request
            * `embedding_dimension_mismatch` - embedding has the wrong number of dimensions
            * `timeout` - time limit exceeded
            * `internal` - internal error
          oneOf:
          - $ref: '#/components/schemas/ErrorCodeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        error_detail:
          type: string
          readOnly: true
          description: Technical detail in English. Set for failed and skipped jobs,
            and as a note for a job that was converted only in part.
        partly_converted:
          type: boolean
          readOnly: true
          description: True if Docling converted the document only in part (conversion_error_count
            above 0), also when the embedding failed afterwards.
        conversion_error_count:
          type: integer
          minimum: 0
          readOnly: true
          description: Errors Docling reported for a conversion it finished only in
            part; 0 for a complete conversion and for a job that has not converted
            anything yet. An embedding job carries the count of the conversion before
            it.
        section_count:
          type: integer
          readOnly: true
          nullable: true
        page_count:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - conversion_error_count
      - created_at
      - error_code
      - error_detail
      - finished_at
      - id
      - page_count
      - partly_converted
      - section_count
      - status
      - step
    IngestJobVersion:
      type: object
      description: The document version of an ingest job.
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
          readOnly: true
        original_filename:
          type: string
          readOnly: true
          title: Original file name
      required:
      - id
      - number
      - original_filename
    IngestRequestError:
      type: object
      description: '400: the version cannot be ingested (a configuration).'
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - code
      - detail
    IngestStatusEnum:
      enum:
      - queued
      - running
      - done
      - failed
      - skipped
      type: string
      description: |-
        * `queued` - queued
        * `running` - running
        * `done` - done
        * `failed` - failed
        * `skipped` - skipped
    KindEnum:
      enum:
      - document
      - configuration
      type: string
      description: |-
        * `document` - document
        * `configuration` - configuration
    MatchKindsEnum:
      enum:
      - exact
      - keyword
      - semantic
      type: string
      description: |-
        * `exact` - exact
        * `keyword` - keyword
        * `semantic` - semantic
    Me:
      type: object
      description: The signed-in user as the web UI needs it.
      properties:
        username:
          type: string
        role:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoleEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_superuser:
          type: boolean
      required:
      - is_superuser
      - role
      - username
    NullEnum:
      enum:
      - null
    PaginatedAuditLogEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
    PaginatedIngestJobList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/IngestJob'
    PatchedArea:
      type: object
      description: An area of a site. ``site`` is the id of the site.
      properties:
        id:
          type: integer
          readOnly: true
        site:
          type: integer
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedDeviceWrite:
      type: object
      description: |-
        Input for creating and changing a device. ``plant`` is the id of the plant.

        An empty IP address is stored as no address (``null``).
      properties:
        plant:
          type: integer
        key:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        name:
          type: string
          maxLength: 200
        device_class:
          $ref: '#/components/schemas/DeviceClassEnum'
        manufacturer:
          type: string
        model:
          type: string
        software_version:
          type: string
        ip_address:
          type: string
          nullable: true
        address_source:
          type: string
        protocols:
          type: string
        notes:
          type: string
    PatchedPlant:
      type: object
      description: A plant of an area. ``area`` is the id of the area.
      properties:
        id:
          type: integer
          readOnly: true
        area:
          type: integer
        key:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        name:
          type: string
          maxLength: 200
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedSite:
      type: object
      description: A site of the operation.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Plant:
      type: object
      description: A plant of an area. ``area`` is the id of the area.
      properties:
        id:
          type: integer
          readOnly: true
        area:
          type: integer
        key:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        name:
          type: string
          maxLength: 200
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - area
      - created_at
      - id
      - key
      - name
      - updated_at
    PlantRef:
      type: object
      description: The plant of a device, for reading.
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - key
      - name
    RoleEnum:
      enum:
      - manage
      - read
      type: string
      description: |-
        * `manage` - manage
        * `read` - read
    SearchDevice:
      type: object
      description: The device the document of a hit belongs to.
      properties:
        id:
          type: integer
        key:
          type: string
        name:
          type: string
      required:
      - id
      - key
      - name
    SearchDocument:
      type: object
      description: The document a hit is stored in.
      properties:
        id:
          type: integer
        title:
          type: string
      required:
      - id
      - title
    SearchHighlight:
      type: object
      description: 'A found place in the snippet: ``snippet[start:end]`` in Unicode
        code points.'
      properties:
        start:
          type: integer
        end:
          type: integer
      required:
      - end
      - start
    SearchHit:
      type: object
      description: One found piece of text with every place it is stored at.
      properties:
        section_id:
          type: integer
        score:
          type: number
          format: double
          description: Higher is better; only the order matters.
        match_kinds:
          type: array
          items:
            $ref: '#/components/schemas/MatchKindsEnum'
          description: 'How the hit was found: exact identifier, keyword, meaning.'
        snippet:
          type: string
          description: Plain text around the first found place, about 300 characters;
            not HTML.
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/SearchHighlight'
        page_start:
          type: integer
          nullable: true
        page_end:
          type: integer
          nullable: true
        heading_path:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            $ref: '#/components/schemas/SearchLocation'
      required:
      - heading_path
      - highlights
      - locations
      - match_kinds
      - page_end
      - page_start
      - score
      - section_id
      - snippet
    SearchLocation:
      type: object
      description: One place a hit is stored at.
      properties:
        document:
          $ref: '#/components/schemas/SearchDocument'
        version:
          $ref: '#/components/schemas/SearchVersion'
        device:
          $ref: '#/components/schemas/SearchDevice'
        plant:
          $ref: '#/components/schemas/SearchPlant'
      required:
      - device
      - document
      - plant
      - version
    SearchPlant:
      type: object
      description: The plant of the device of a hit.
      properties:
        id:
          type: integer
        key:
          type: string
        name:
          type: string
      required:
      - id
      - key
      - name
    SearchResult:
      type: object
      description: The hits of a search, best first.
      properties:
        semantic:
          allOf:
          - $ref: '#/components/schemas/SemanticEnum'
          description: |-
            Whether the search by meaning took part: used; disabled (AI features off, a normal state); unavailable (model service failed, keyword search only).

            * `used` - used
            * `disabled` - disabled
            * `unavailable` - unavailable
        hits:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
      required:
      - hits
      - semantic
    SearchVersion:
      type: object
      description: The document version a hit is stored in.
      properties:
        id:
          type: integer
        number:
          type: integer
        original_filename:
          type: string
        is_latest:
          type: boolean
          description: False when the document has a newer version that is not searchable
            yet (not ingested, or ingesting it failed).
      required:
      - id
      - is_latest
      - number
      - original_filename
    Selftest:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/DatabaseCheck'
        worker:
          $ref: '#/components/schemas/WorkerCheck'
        ai:
          $ref: '#/components/schemas/AiCheck'
      required:
      - ai
      - database
      - worker
    SemanticEnum:
      enum:
      - used
      - disabled
      - unavailable
      type: string
      description: |-
        * `used` - used
        * `disabled` - disabled
        * `unavailable` - unavailable
    Site:
      type: object
      description: A site of the operation.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    SiteRef:
      type: object
      description: The site of a device, for reading.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    StepEnum:
      enum:
      - convert
      - sections
      - embed
      type: string
      description: |-
        * `convert` - convert
        * `sections` - sections
        * `embed` - embed
    UploadResult:
      type: object
      description: 'Answer to an upload: the document, the new version and other places
        of its content.'
      properties:
        document:
          $ref: '#/components/schemas/Document'
        version:
          $ref: '#/components/schemas/DocumentVersion'
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/Duplicate'
      required:
      - document
      - duplicates
      - version
    VersionUpload:
      type: object
      description: Form of a new version of an existing file (``multipart/form-data``).
      properties:
        file:
          type: string
          format: binary
          description: The file; at most TWOX_UPLOAD_MAX_BYTES bytes.
      required:
      - file
    WorkerCheck:
      type: object
      properties:
        ok:
          type: boolean
        result:
          type: string
        duration_ms:
          type: integer
          minimum: 0
        error:
          type: string
      required:
      - duration_ms
      - error
      - ok
      - result
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
