# All paths are relative to this file (deploy/compose).
# Values come from the .env file in the repository root; see .env.example.

x-backend-environment: &backend-environment
  TWOX_SECRET_KEY: ${TWOX_SECRET_KEY:?Copy .env.example to .env first}
  TWOX_DEBUG: ${TWOX_DEBUG:-}
  TWOX_ALLOWED_HOSTS: ${TWOX_ALLOWED_HOSTS:-}
  TWOX_DB_HOST: ${TWOX_DB_HOST:-db}
  TWOX_DB_PORT: ${TWOX_DB_PORT:-5432}
  TWOX_DB_NAME: ${TWOX_DB_NAME:?Copy .env.example to .env first}
  TWOX_DB_USER: ${TWOX_DB_USER:?Copy .env.example to .env first}
  TWOX_DB_PASSWORD: ${TWOX_DB_PASSWORD:?Copy .env.example to .env first}
  TWOX_CELERY_BROKER_URL: ${TWOX_CELERY_BROKER_URL:-}
  TWOX_CELERY_RESULT_BACKEND: ${TWOX_CELERY_RESULT_BACKEND:-}
  TWOX_CACHE_URL: ${TWOX_CACHE_URL:-}
  TWOX_LLM_BASE_URL: ${TWOX_LLM_BASE_URL:-}
  TWOX_DOCLING_URL: ${TWOX_DOCLING_URL:-}
  TWOX_MEDIA_ROOT: ${TWOX_MEDIA_ROOT:-}
  TWOX_UPLOAD_MAX_BYTES: ${TWOX_UPLOAD_MAX_BYTES:-}

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: ${TWOX_DB_NAME:?Copy .env.example to .env first}
      POSTGRES_USER: ${TWOX_DB_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${TWOX_DB_PASSWORD:?Copy .env.example to .env first}
    volumes:
      # PostgreSQL 18 images keep their data below /var/lib/postgresql,
      # not /var/lib/postgresql/data as in 17 and older.
      - db-data:/var/lib/postgresql
    healthcheck:
      # TCP on purpose: the temporary server during first initialisation only
      # listens on the Unix socket and must not count as healthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
      start_interval: 1s

  # Broker and result store for Celery. Reachable inside the compose network
  # only: no host port.
  valkey:
    image: valkey/valkey:9.1.4
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
      start_interval: 1s
    restart: unless-stopped

  # Applies the migrations once and exits. A separate service instead of a
  # start script in the API container, so that several API instances never
  # migrate at the same time.
  migrate:
    # Context is the repository root: the runtime image also builds the web
    # UI from web/. The .dockerignore in the root admits backend/ and web/ only.
    build: &backend-runtime-build
      context: ../..
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: *backend-runtime-build
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      # Shared with worker; written through twox.files.storage only.
      - media-data:/data/media
    ports:
      # Reachable from this machine only.
      - "127.0.0.1:${TWOX_API_PORT:-8000}:8000"
    # default: database, Valkey, Ollama on the host; docling-internal: Docling.
    networks:
      - default
      - docling-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # The runtime image has no curl; Python is always there. The request goes
      # to localhost, which therefore has to stay in TWOX_ALLOWED_HOSTS.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # One worker for all three queues. Splitting it into one service per queue
  # only needs a different -Q list.
  worker:
    build: *backend-runtime-build
    command:
      - celery
      - -A
      - twox.config
      - worker
      - --queues
      - ingest,embed,default
      - --loglevel
      - INFO
    environment: *backend-environment
    volumes:
      # Same volume as api: the worker reads what the API stored.
      - media-data:/data/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    # default: database, Valkey, Ollama on the host; docling-internal: Docling.
    networks:
      - default
      - docling-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Asks exactly this worker through the broker; fails if the worker or
      # Valkey is gone.
      test:
        - CMD-SHELL
        - celery -A twox.config inspect ping --destination "celery@$$HOSTNAME" --timeout 5
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  # Document conversion (CPU image, models included). Reachable only from api
  # and worker over the internal network docling-internal (E-32): no host
  # port, no route to the outside. backend-dev is not attached, so run
  # check_docling in api or worker. api and worker do not depend on it;
  # they start while Docling is still loading or missing. Pinned by tag and
  # digest (multi-platform index).
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.38.2@sha256:7a480a1604fa3b42efeddc7db9527690d9f9bc903226136013e2bfe6b1a4dfb0
    environment:
      # Web UI off (also the default) - the API is all the backend needs.
      DOCLING_SERVE_ENABLE_UI: "false"
      # /version stays on: check_docling reads the version from it.
      DOCLING_SERVE_SHOW_VERSION_INFO: "true"
      # No metrics collection, no /metrics endpoint, no traces or OTLP export.
      DOCLING_SERVE_OTEL_ENABLE_METRICS: "false"
      DOCLING_SERVE_OTEL_ENABLE_PROMETHEUS: "false"
      DOCLING_SERVE_OTEL_ENABLE_TRACES: "false"
      DOCLING_SERVE_OTEL_ENABLE_OTLP_METRICS: "false"
      # Operation without internet: the models ship in the image
      # (DOCLING_SERVE_ARTIFACTS_PATH is set by the image). No remote
      # inference services, no external plugins, no Hugging Face Hub access.
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS: "false"
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      # Telemetry of ONNX Runtime 1.31 (bundled in the image): without this
      # switch the server process opens an HTTPS connection to
      # mobile.events.data.microsoft.com shortly after start. Measured in
      # work order 009.
      ORT_DISABLE_TELEMETRY: "1"
      # E-31: the EasyOCR weights in the image have no known licence and are
      # never used. Only RapidOCR (Apache-2.0) is allowed; docling-serve
      # rejects every other OCR preset with HTTP 422 - including "auto",
      # which falls back to EasyOCR when RapidOCR rejects a language. Every
      # request therefore has to send ocr_preset "rapidocr".
      DOCLING_SERVE_DEFAULT_OCR_PRESET: rapidocr
      DOCLING_SERVE_DEFAULT_OCR_KIND: rapidocr
      DOCLING_SERVE_ALLOWED_OCR_PRESETS: rapidocr
      DOCLING_SERVE_ALLOWED_OCR_KINDS: rapidocr
      # The warm-up at boot converts with the built-in default preset "auto"
      # and fails once "auto" is not allowed. Models load with the first
      # conversion instead.
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
    # E-32: internal network only, no route to the internet. api and worker
    # are attached to it as well; nothing else is.
    networks:
      - docling-internal
    healthcheck:
      # /ready answers once the server and its queue run (the models load
      # with the first conversion, see DOCLING_SERVE_LOAD_MODELS_AT_BOOT).
      # Python as in the other services; curl happens to be in the image, but
      # nothing relies on it.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 4
      # Generous: the start takes 15 to 20 s on the development machine, longer
      # on slow disks.
      start_period: 300s
      start_interval: 5s
    restart: unless-stopped

  # Depends on the database only: plain `pytest` must not need Valkey or the
  # worker. `pytest -m worker` expects both to be running already.
  backend-dev:
    profiles: ["dev"]
    # Same Dockerfile and context as the runtime image; the target dev does
    # not build the web UI.
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: dev
    environment: *backend-environment
    volumes:
      - ../../backend:/app
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  # All services except docling. Has a route to the outside (Ollama on the
  # host via host.docker.internal).
  default:
  # docling and the services that call it (E-32). internal: no route to the
  # outside, so docling-serve cannot download or send anything.
  docling-internal:
    internal: true

volumes:
  db-data:
  valkey-data:
  # Uploaded files, content-addressed (twox.files.storage). Created empty with
  # the owner of /data/media in the runtime image (twox, uid/gid 10001).
  media-data:
