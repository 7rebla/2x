# Tooling containers for the web UI: web-dev (lint, type check, tests, build)
# and e2e (browser test with Playwright).
# Valid on its own; does not depend on services of other compose files.
# The root compose.yaml includes this file, so both services are also
# reachable with plain `docker compose` from the repository root.
# Usage from the repository root:
#   docker compose --profile dev run --rm web-dev npm ci
#   docker compose up -d --wait db valkey worker api
#   docker compose --profile e2e run --rm e2e
services:
  web-dev:
    profiles: ["dev"]
    build:
      context: ../../web
      target: dev
    working_dir: /app
    volumes:
      - ../../web:/app
      # Keep node_modules out of the bind-mounted host folder.
      - web_node_modules:/app/node_modules

  # Browser test of the test page served by Django (Chromium only). Uses the
  # packages installed by web-dev (`npm ci`) from the shared volume. The
  # image version must match @playwright/test in web/package-lock.json
  # exactly, otherwise Playwright does not find its browsers. Pinned by tag
  # and digest (multi-platform index).
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    working_dir: /app
    # Recommended by the Playwright Docker docs: an init process for the
    # browser processes, and enough shared memory for Chromium (instead of
    # sharing the host IPC namespace).
    init: true
    shm_size: 1gb
    environment:
      CI: "true"
      # Django service (test page and API) inside the compose network.
      TWOX_E2E_API_URL: ${TWOX_E2E_API_URL:-http://api:8000}
    volumes:
      - ../../web:/app
      - web_node_modules:/app/node_modules
    command: ["npm", "run", "e2e"]

volumes:
  web_node_modules:
