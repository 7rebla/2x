# Tooling container for the web UI (lint, type check, tests, build).
# Valid on its own; does not depend on services of other compose files.
# Usage from the repository root:
#   docker compose -f deploy/compose/compose.web.yaml run --rm web-dev npm ci
services:
  web-dev:
    profiles: ["dev"]
    build:
      context: ../../web
      target: dev
    working_dir: /app
    volumes:
      - ../../web:/app
      # Keep node_modules out of the bind-mounted host folder.
      - web_node_modules:/app/node_modules

volumes:
  web_node_modules:
