[project]
name = "twox"
version = "0.0.0"
description = "2x backend: asset records with sourced answers"
requires-python = ">=3.14,<3.15"
dependencies = [
    "celery[redis]>=5.7.0,<5.8",
    "django>=6.1.3,<6.2",
    "djangorestframework>=3.18.3,<3.19",
    "drf-spectacular>=0.30.0,<0.31",
    "psycopg[binary]>=3.3.9,<3.4",
    "uvicorn>=0.54.0,<0.55",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0,<0.27",
    "django-stubs[compatible-mypy]>=6.1.2,<6.2",
    "djangorestframework-stubs[compatible-mypy]>=3.18.2,<3.19",
    "mypy>=2.4.1,<2.5",
    "pip-licenses>=5.5.5,<6",
    "pytest>=9.2.0,<10",
    "pytest-django>=4.14.0,<5",
    "ruff>=0.17.6,<0.18",
]

# The backend is an application, not a distributable package: uv only manages
# the environment. Update the lock file inside the dev container:
#   docker compose run --rm backend-dev uv lock
[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "N",   # naming
    "UP",  # modern syntax
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplifications
    "ANN", # type annotations on every function
    "DJ",  # Django
    "RUF", # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by Django: long help texts, plain class attributes.
"**/migrations/*.py" = ["E501", "RUF012"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "twox.config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "twox.config.settings"
pythonpath = ["."]
testpaths = ["tests"]
# Plain `pytest` needs the database only. Tests that need a running Celery
# worker carry the marker `worker` and run with `pytest -m worker`.
addopts = ["--strict-markers", "--strict-config", "-ra", "-m", "not worker"]
markers = [
    "worker: needs a running Celery worker (run with `pytest -m worker`)",
]
xfail_strict = true
