# Type checking of the test factory tools.
#   mypy --config-file testfactory/mypy.ini testfactory
[mypy]
python_version = 3.14
strict = True
# Downloaded vendor material and generated configurations may contain foreign
# Python files; they are not part of our code.
exclude = (?x)(
    ^testfactory/extern/
    | ^testfactory/generated/
  )
