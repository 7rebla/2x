      "expected_answer": "Der Schutzstopp (SF2, Stoppkategorie 2) kommt von einer externen Schutzeinrichtung am Sicherheitseingang; der Antrieb bleibt an. Mit konfiguriertem Schutz-Reset gibt erst eine steigende Flanke (LOW auf HIGH) am Reset-Eingang den Roboter frei, etwa per zweikanaliger Reset-Taste außerhalb der Schutzzone. Ohne Reset geht es automatisch weiter, sobald die Schutzeinrichtung nicht mehr auslöst.",
